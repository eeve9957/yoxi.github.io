<style>
:root{--pg:#e9edf4;--pn:#fff;--ln:#d6deec;--tx:#0f172a;--mt:#5b6781;--red:#E60012;--soft:#eef2f9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--pg);color:var(--tx);font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:14px}
.shell{display:flex;min-height:100%;gap:0}

main{flex:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
h2{font-size:11px;letter-spacing:.08em;color:var(--mt);margin:14px 0 8px;text-transform:uppercase}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:34px;height:34px;border-radius:9px;background:var(--red);color:#fff;font-weight:900;display:grid;place-items:center;font-size:18px}
.brand b{font-size:15px}.brand small{display:block;color:var(--mt);font-size:11px}
.scs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scb{background:var(--soft);border:1px solid var(--ln);color:var(--tx);border-radius:11px;padding:9px;text-align:left;cursor:pointer;font:inherit;font-size:12px}
.scb.on{border-color:var(--red);background:rgba(230,0,18,.1)}
.scb small{display:block;color:var(--mt);font-size:10px;margin-top:2px}
.eng{background:var(--soft);border:1px solid var(--ln);border-radius:11px;padding:10px;margin-bottom:8px;font-size:12px}
.eng h3{margin:0 0 6px;font-size:12px;display:flex;justify-content:space-between}

.kv{display:flex;justify-content:space-between;padding:2px 0;color:var(--mt)}.kv b{color:var(--tx);font-weight:500}
.mb{height:6px;border-radius:9px;background:var(--ln);overflow:hidden;margin:3px 0 5px}.mb i{display:block;height:100%;transition:width .4s}
.code{font:11px/1.5 ui-monospace,Menlo,monospace;background:var(--pg);border-radius:8px;padding:8px;white-space:pre-wrap;word-break:break-all}
.log{max-height:130px;overflow-y:auto;font:11px/1.6 ui-monospace,Menlo,monospace;color:var(--mt)}
/* phone */
#phone{width:100%;max-width:390px;height:min(800px,calc(100vh - 32px));background:#0f172a;color:#e2e8f0;border:10px solid #1e293b;border-radius:46px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.stat{display:flex;justify-content:space-between;padding:10px 22px 6px;font-size:12px;font-weight:700}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid #1e293b}
.hdr .lg{display:flex;align-items:center;gap:7px;font-weight:700}
.hdr .lg i{width:26px;height:26px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-style:normal;font-weight:900;font-size:13px;color:#fff}
.tag{font-size:10px;background:rgba(230,0,18,.2);color:#ff6b75;border:1px solid rgba(230,0,18,.35);border-radius:5px;padding:1px 5px}
.pill{background:#1e293b;border-radius:99px;padding:4px 9px;font-size:11px}
.scr{flex:1;overflow-y:auto;padding:12px}
.nv{display:flex;border-top:1px solid #1e293b;background:#0f172a}
.nv button{flex:1;background:none;border:0;color:#94a3b8;padding:9px 0 11px;font:inherit;font-size:10px;cursor:pointer}
.nv button.on{color:#ff4b57;font-weight:700}.nv button span{display:block;font-size:17px}
.note{background:linear-gradient(120deg,#1e293b,#172036);border:1px solid rgba(230,0,18,.45);border-radius:15px;padding:11px;display:flex;gap:9px;margin-bottom:10px;animation:up .4s}
.note b{font-size:12px}.note p{margin:3px 0 0;font-size:11px;color:#cbd5e1;line-height:1.5}
.note button{margin-left:auto;background:none;border:0;color:#64748b;cursor:pointer;align-self:flex-start}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cta{background:var(--red);border-radius:13px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:12px;font-weight:700}
.cta button{background:#fff;color:var(--red);border:0;border-radius:9px;padding:7px 10px;font-weight:800;cursor:pointer;font-size:12px;white-space:nowrap}
.rad{background:#162038;border:1px solid #27334f;border-radius:15px;padding:11px;margin-bottom:10px}
.rad .tt{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;text-align:center;font-size:10px}
.g3 div{background:#0b1220;border-radius:10px;padding:7px 3px;color:#94a3b8}.g3 b{display:block;color:#e2e8f0;font-size:12px;margin-top:2px}
.sh{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;margin:4px 2px 7px}
.sh span{font-size:10px;font-weight:400;color:#fbbf24;background:rgba(251,191,36,.12);padding:1px 6px;border-radius:5px}
.sc{background:#162038;border:1px solid #27334f;border-radius:15px;padding:11px;margin-bottom:8px;cursor:pointer;position:relative;overflow:hidden}
.sc.on{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.sc .r{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.rt{font-size:10px;color:#fbbf24}
.mu{margin:2px 0 0;font-size:11px;color:#94a3b8}
.r2{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:7px;border-top:1px solid #27334f;font-size:11px;color:#cbd5e1}
.rs{margin:7px 0 0;background:#0b1220;border-radius:8px;padding:5px 8px;font-size:10px;color:#cbd5e1;line-height:1.5}.rs em{color:#fbbf24;font-style:normal;float:right}
.sur{position:absolute;top:0;right:0;background:linear-gradient(90deg,#f97316,var(--red));font-style:normal;font-size:9px;font-weight:800;padding:2px 8px;border-bottom-left-radius:9px}
.bd{font-size:10px;padding:1px 7px;border-radius:6px;border:1px solid}
.b0{color:#fcd34d;border-color:rgba(252,211,77,.4);background:rgba(252,211,77,.12)}
.b1{color:#6ee7b7;border-color:rgba(110,231,183,.4);background:rgba(110,231,183,.12)}
.b2{color:#fde68a;border-color:rgba(253,230,138,.4);background:rgba(253,230,138,.1)}
.b3{color:#fca5a5;border-color:rgba(252,165,165,.4);background:rgba(252,165,165,.12)}
.dec{background:#1b2640;border:1px solid #334266;border-radius:15px;padding:12px;margin:12px 0;animation:up .3s}
.dec h4{margin:0 0 8px;font-size:12px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cb{background:#0b1220;border:1px solid #27334f;border-radius:11px;padding:9px;font-size:11px;color:#94a3b8;position:relative}
.cb b{display:block;font-size:17px;color:#e2e8f0;margin:3px 0}.cb small{display:block;line-height:1.4}
.cb.hi{border-color:rgba(230,0,18,.7);background:linear-gradient(#2a1319,#0b1220)}
.cb em{position:absolute;top:8px;right:9px;font-style:normal;color:#fcd34d;font-weight:700}
.vd{margin:9px 0;font-size:11px;color:#a7f3d0;text-align:center}
.bt{display:flex;gap:7px;margin-top:6px}
.btn{flex:1;border:0;border-radius:10px;padding:10px 6px;font:inherit;font-weight:700;font-size:12px;cursor:pointer;background:#27334f;color:#e2e8f0}
.btn.p{background:var(--red);color:#fff;flex:1.6}
a.btn{text-decoration:none;display:flex;align-items:center;justify-content:center;text-align:center}
.btn:active{transform:scale(.97)}
.cnf{font-size:10px;color:#94a3b8;text-align:center;margin-top:8px}
.ov{position:absolute;inset:0;background:rgba(2,6,16,.96);z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;animation:up .3s}
.rdr{width:96px;height:96px;border-radius:50%;background:rgba(230,0,18,.2);border:1px solid rgba(230,0,18,.45);display:grid;place-items:center;font-size:38px;animation:pl 1.8s infinite}
@keyframes pl{50%{transform:scale(1.1);opacity:.55}}
.ov .box{width:100%;background:#0f172a;border:1px solid #1e293b;border-radius:15px;padding:12px;margin:16px 0;font-size:12px;text-align:left}
.pg{height:6px;border-radius:9px;background:#1e293b;overflow:hidden;margin-top:6px}.pg i{display:block;height:100%;background:#34d399;transition:width 2.4s linear}
.card{background:#162038;border:1px solid #27334f;border-radius:15px;padding:12px;margin-bottom:10px}
.card h4{margin:0 0 6px;font-size:13px}.card p{margin:0;font-size:11px;color:#94a3b8;line-height:1.6}
.tg{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid #27334f;font-size:12px}
.tg:first-of-type{border-top:0}.tg small{display:block;color:#94a3b8;font-size:10px}
.tg input[type=checkbox]{accent-color:var(--red);width:20px;height:20px}
.tg input[type=range]{accent-color:var(--red);width:120px}
.kp{font-size:26px;font-weight:900;margin:2px 0}
.fb{width:100%;display:flex;gap:8px}
.fab{display:none}
@media (max-width:900px){
 .shell{flex-direction:column}aside{width:100%;height:auto;position:static;border-right:0;border-top:1px solid var(--ln)}
 main{padding:0}#phone{max-width:none;height:100dvh;border:0;border-radius:0}
 .fab{display:block;position:fixed;right:12px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--red);color:#fff;border:0;border-radius:99px;padding:9px 14px;font:inherit;font-weight:700;font-size:12px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
 .stat{padding-top:calc(8px + env(safe-area-inset-top,0px))}
}
</style>

<script>

var S=[

 pt:"外頭下大雨,返家免淋雨方案",pb:"偵測到降雨量上升與捷運排隊人潮,附近已有 yoxi 司機整備。",cta:"雨勢加大,門口上車免淋雨",

 P("美麗華摩天輪夜景","宵夜／約會","NT$400",4.8,"步行 50 分",14,2,4,8,210,"受控驚喜:離場不急著回家",1,70)]}];
var SURL=["小幅(距離 +3 分)","標準(距離或價格擇一)","大膽(兩項皆突破)"];
var st,tm;
function init(){st={sc:0,sel:2,tab:"radar",note:true,disp:0,logs:[],adj:{},saved:{},s:{open:1,views:0,dec:0,ride:0,cta:0,sur:0,push:1},pref:{loc:true,hist:true,sur:1,cap:2}};
 log("CONTEXT","識別為「"+S[0].n+"」情境 ("+S[0].loc+")");log("DISCOVER","產出 2 熟悉 + 1 受控驚喜")}
function log(k,m){st.logs.unshift("["+new Date().toTimeString().slice(0,8)+"] "+k+": "+m);st.logs=st.logs.slice(0,40)}
function mt(sp){return Math.max(40,Math.min(99,sp.match+(st.adj[sp.title]||0)))}
function PB(p){return['<span class="bd b0">⛔ 不可開車</span>','<span class="bd b1">🟢 容易</span>','<span class="bd b2">🟡 普通</span>','<span class="bd b3">🔴 困難</span>'][p]}
function calc(sp){var yox=2+sp.drive;if(!sp.park)return{yox:yox,self:null,save:null};var self=Math.round(sp.drive+(sp.lo+sp.hi)/2);return{yox:yox,self:self,save:self-yox}}
var DEST={"返回家中(南港→市政府)":"市政府捷運站","返回家中(大安→板橋)":"板橋車站","前往台北車站":"台北車站","松菸誠品食堂":"松山文創園區 誠品","Citylink 美食街":"南港 Citylink"};

function cmp(sp){var c=calc(sp),l,v;
 if(c.self===null){l='<div class="cb"><span>🚗 自行開車</span><b>⛔ 不建議</b><small>飲酒或夜間不建議自駕</small></div>';v="飲酒不開車,搭 yoxi 最安心"}
 else{l='<div class="cb"><span>🚗 自行開車</span><b>約 '+c.self+' 分</b><small>行車 '+sp.drive+' + 找位 '+sp.lo+'–'+sp.hi+'(Phase 2 預估區間)</small></div>';
  v=c.save>=8?"搭 yoxi 約省 "+c.save+" 分鐘找位時間":"兩者時間差不大,依今天的心情選擇(不硬推叫車)"}
 return'<div class="cmp">'+l+'<div class="cb hi"><span>🚕 叫 yoxi</span><b>約 '+c.yox+' 分</b><small>等候 2 + 車程 '+sp.drive+',門口下車</small><em>NT$'+sp.fare+'</em></div></div><div class="vd">'+v+'</div>'}
function radar(c){var h="";
 if(st.note)h+='<div class="note"><span style="font-size:20px">✨</span><div><b>'+c.pt+' <span class="tag">Context AI</span></b><p>'+c.pb+'</p></div><button data-a="nc">✕</button></div>';
 else if(st.s.push>=st.pref.cap)h+='<div class="note" style="border-color:#334266"><span style="font-size:18px">🔕</span><div><p>今日推播已達上限('+st.pref.cap+' 則),避免通知疲勞,以下為你主動開啟的雷達。</p></div></div>';

 c.sp.forEach(function(s,i){h+='<div class="sc'+(st.sel===i?" on":"")+'" data-a="spot" data-i="'+i+'">'+(s.sur?'<i class="sur">⚡ 受控驚喜</i>':"")+'<div class="r"><b>'+s.title+'</b><span class="rt">★'+s.rt+'</span></div><p class="mu">'+s.cu+' · '+s.price+'</p><div class="r2"><span>🚶 '+s.walk+' | 🚗 '+s.drive+' 分</span>'+PB(s.park)+'</div><p class="rs">「'+s.reason+'」<em>匹配 '+mt(s)+'%</em></p></div>'});

 '<div class="bt"><button class="btn" data-a="went">我去了</button><button class="btn" data-a="skip">不太適合</button></div><div class="cnf">預估僅供參考,信心:'+(sp.park?"中":"高")+' · 你的回饋會校正下次推薦</div></div>';

function tg(k,t,d,v){return'<div class="tg"><div>'+t+'<small>'+d+'</small></div><input type="checkbox" data-p="'+k+'"'+(v?" checked":"")+'></div>'}
function pref(){var p=st.pref;
 return'<div class="card"><h4>🔐 隱私與授權</h4><p>明確告知、可隨時退出,遵循個資法。</p>'+tg("loc","位置授權","用於判斷生活圈與步行/車程",p.loc)+tg("hist","歷史互動學習","收藏、前往、忽略用於校正推薦",p.hist)+'</div>'+
 '<div class="card"><h4>⚡ 探索強度</h4><p>目前:'+SURL[p.sur]+'</p><div class="tg"><div>驚喜突破幅度<small>保守 ← → 大膽</small></div><input type="range" min="0" max="2" step="1" value="'+p.sur+'" data-p="sur"></div>'+
 '<div class="tg"><div>每日推播上限<small>寧可少而準:'+p.cap+' 則</small></div><input type="range" min="1" max="3" step="1" value="'+p.cap+'" data-p="cap"></div></div>'+
 '<div class="card"><h4>🗑️ 退出並清除</h4><p>清除本次 Demo 的學習資料並重新開始。</p><div class="bt"><button class="btn" data-a="reset">清除資料</button></div></div>'}
function bar(l,v,t,d){var w=t?Math.min(100,Math.round(v/t*100)):0;return'<div class="card"><p>'+l+'</p><div class="kp">'+v+' <small style="font-size:12px;font-weight:400;color:#94a3b8">'+d+'</small></div><div class="pg"><i style="width:'+w+'%;transition:none"></i></div></div>'}
function kpi(){var s=st.s,r=s.views?Math.round(s.dec/s.views*100):0,c=s.cta?Math.round(s.ride/s.cta*100):0;
 return'<div class="card"><h4>三個北極星指標</h4><p>以下為本次操作的示意數據,實際成效以 Pilot 與 A/B 測試驗證(H1–H3)。</p></div>'+
 bar("① 非叫車情境開啟(H1)",s.open,10,"次")+bar("② 推薦 → 收藏/導航/前往 決策率(H2)",r+"%",0,"("+s.dec+"/"+s.views+" 次點開)").replace('style="width:0%','style="width:'+r+'%')+
 bar("③ 高意圖 CTA → 叫車轉換(H3)",c+"%",0,"("+s.ride+"/"+s.cta+" 次曝光)").replace('style="width:0%','style="width:'+c+'%')+
 '<div class="card"><h4>學習到的偏好</h4><p>受控驚喜被點開 '+s.sur+' 次。系統依你的接受度調整下次距離/價格/類型的突破幅度。</p></div>'+
 '<div class="card"><h4>三階段路線</h4><p><b>Phase 1 Micro Trip</b> 午餐 60–90 分,單城市 Pilot。<br><b>Phase 2 Mini Trip</b> 週末半日與高意圖場景。<br><b>Phase 3 Day Trip</b> 旅客一日遊,多語多點移動。</p></div>'}
function ov(){if(!st.disp)return"";var sp=S[st.sc].sp[st.sel],d=st.disp,x="";
 if(d===1)x='<h3>正在為你配對司機</h3><p style="color:#94a3b8;font-size:12px">前往 <b style="color:#fcd34d">'+sp.title+'</b></p>';
 else if(d===2)x='<h3>司機已接單,正在趕來</h3><div class="box"><div>🚘 ABC-1234 · 王師傅 · ★4.9</div><div class="pg"><i style="width:100%"></i></div></div>';
 else x='<h3>已抵達上車點 ✅</h3><p style="color:#94a3b8;font-size:12px">這次推薦對你有幫助嗎?</p><div class="fb" style="margin-top:14px"><button class="btn" data-a="fb1">👍 有幫助</button><button class="btn" data-a="fb0">👎 沒幫助</button></div>';
 var bx=d===1?'<div class="box"><div class="kv" style="color:#94a3b8">預估抵達<b style="color:#6ee7b7">2 分鐘內</b></div><div class="kv" style="color:#94a3b8">預估車資<b style="color:#fff">NT$'+sp.fare+'</b></div><div class="kv" style="color:#94a3b8">路徑<b style="color:#93c5fd">已避開壅塞路段</b></div></div>':"";
 return'<div class="ov"><div class="rdr">🚕</div><div style="height:14px"></div>'+x+bx+(d<3?'<button class="btn" style="flex:none;padding:9px 22px;border-radius:99px" data-a="cancel">取消叫車體驗</button>':"")+'</div>'}
function sheet(){if(!st.sheet)return"";return'<div class="ov" style="justify-content:flex-end;padding:0;background:rgba(2,6,16,.7)" data-a="sheetclose"><div class="box" style="margin:0;border-radius:20px 20px 0 0;padding:16px 14px 20px"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:13px">切換地點與情境</b><button data-a="sheet" style="background:none;border:0;color:#94a3b8;font-size:18px;cursor:pointer;padding:4px 8px">✕</button></div><p style="color:#94a3b8;font-size:11px;margin:4px 0 10px">體驗不同時間地點下,雷達如何主動提供建議</p>'+S.map(function(x,i){return'<button class="btn" style="width:100%;margin-bottom:7px;text-align:left;display:block;padding:13px 12px;'+(st.sc===i?"outline:2px solid var(--red)":"")+'" data-a="sc" data-i="'+i+'">'+x.i+' '+x.n+' · '+x.t+' · '+x.loc+'</button>'}).join("")+'</div></div>'}
function phone(){var c=S[st.sc],old=document.querySelector(".scr"),y=old?old.scrollTop:0,b=st.tab==="radar"?radar(c):st.tab==="pref"?pref():kpi();
 document.getElementById("phone").innerHTML='<div class="stat"><span>'+c.t+'</span><span>📶 ᯤ 🔋</span></div><div class="hdr"><div class="lg"><i>y</i>yoxi <span class="tag">AI 移動雷達</span></div><span class="pill" data-a="sheet" style="cursor:pointer">📍 '+c.loc+' ▾</span></div><div class="scr">'+b+'</div>'+ov()+sheet()+
 '<div class="nv">'+[["radar","📡","移動雷達"],["pref","🔐","偏好與隱私"]].map(function(t){return'<button data-a="tab" data-t="'+t[0]+'" class="'+(st.tab===t[0]?"on":"")+'"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join("")+'</div>';
 var n=document.querySelector(".scr");if(n)n.scrollTop=y}
function all(){phone()}
function pick(i){st.sc=i;st.sel=2;st.s.open++;st.tab="radar";var c=S[i];
 if(st.s.push<st.pref.cap){st.note=true;st.s.push++;log("PUSH","「"+c.pt+"」")}else{st.note=false;log("GUARD","已達每日推播上限,略過推播(避免通知疲勞)")}
 if(c.int>65){st.s.cta++;log("INTENT","高意圖 "+c.int+"%,顯示叫車入口")}log("CONTEXT","切換至「"+c.n+"」");all()}
function act(a,e){var c=S[st.sc],sp=c.sp[st.sel];
 if(a==="sheet"||a==="sheetclose"){st.sheet=!st.sheet;return phone()}
 if(a==="sc"){st.sheet=false;return pick(+e.dataset.i)}
 if(a==="spot"){st.sel=+e.dataset.i;st.s.views++;var s=c.sp[st.sel];if(s.sur)st.s.sur++;log("DECIDE","點開「"+s.title+"」"+(s.sur?"(受控驚喜)":""));return all()}
 if(a==="nc"){st.note=false;return phone()}
 if(a==="tab"){st.tab=e.dataset.t;return phone()}
 if(a==="save"){if(!st.saved[sp.title]){st.saved[sp.title]=1;st.adj[sp.title]=(st.adj[sp.title]||0)+3;st.s.dec++;log("LEARN","收藏「"+sp.title+"」→ 偏好 +3")}return all()}
 if(a==="nav"){st.adj[sp.title]=(st.adj[sp.title]||0)+2;st.s.dec++;log("DECIDE","開啟 Google Maps 導航 → 偏好 +2");return}
 if(a==="went"){st.adj[sp.title]=(st.adj[sp.title]||0)+4;st.s.dec++;log("LEARN","實際前往「"+sp.title+"」→ 偏好 +4");return all()}
 if(a==="skip"){st.adj[sp.title]=(st.adj[sp.title]||0)-6;log("LEARN","「"+sp.title+"」不適合"+(sp.sur?",下次降低此類突破幅度":"")+" → 偏好 -6");return all()}
 if(a==="ride"){st.s.ride++;st.disp=1;log("MOVE","呼叫 yoxi 前往「"+sp.title+"」");clearTimeout(tm);tm=setTimeout(function(){st.disp=2;phone();tm=setTimeout(function(){st.disp=3;phone()},2600)},1800);return phone()}
 if(a==="cancel"){clearTimeout(tm);st.disp=0;st.s.ride--;log("MOVE","取消叫車體驗");return all()}
 if(a==="fb1"||a==="fb0"){st.disp=0;log("LEARN","叫車後回饋:"+(a==="fb1"?"有幫助 → 提高情境權重":"沒幫助 → 降低此情境 CTA 頻率"));return all()}
 if(a==="reset"){var p=st.pref;init();st.pref=p;st.tab="pref";log("RESET","已清除學習資料");return all()}}
document.addEventListener("click",function(ev){var e=ev.target.closest("[data-a]");if(!e)return;if(e.dataset.a==="sheetclose"&&ev.target!==e)return;act(e.dataset.a,e)});
document.addEventListener("change",function(ev){var k=ev.target.dataset.p;if(!k)return;var t=ev.target;st.pref[k]=t.type==="checkbox"?t.checked:+t.value;log("PREF",k+" → "+st.pref[k]);all()});
init();all();
</script>
</body>
</html>
