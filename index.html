<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yoxi AI 移動雷達</title>
<style>
:root{--bg:#E9EDF5;--card:#fff;--ink:#14213D;--mut:#5B6882;--or:#E8602C;--tint:#EEF3FB;--pk:#FDEBE3;--ok:#2EAD5B;--mid:#F2B705;--bad:#D64545;--line:#DDE3EE;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0F1C;--card:#16213A;--ink:#EAF0FB;--mut:#9AA8C2;--tint:#1F2C48;--pk:#3A2A26;--line:#2B3957}}
:root[data-theme="dark"]{--bg:#0A0F1C;--card:#16213A;--ink:#EAF0FB;--mut:#9AA8C2;--tint:#1F2C48;--pk:#3A2A26;--line:#2B3957}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:18px;display:grid;grid-template-columns:392px 1fr;gap:22px;align-items:start}
@media(max-width:860px){.wrap{display:block;padding:0}.phone{border:0!important;border-radius:0!important;height:100dvh!important;max-width:none!important}.judge{padding:14px}}
.phone{background:var(--card);border:7px solid #0b1224;border-radius:38px;overflow:hidden;width:100%;max-width:392px;margin:0 auto;display:flex;flex-direction:column;height:780px;position:relative}
.bar0{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 6px;font-weight:800}
.logo{color:var(--or);font-size:18px;letter-spacing:.5px}
.screen{flex:1;overflow-y:auto;padding:6px 14px 16px}
.nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
.nav button{flex:1;border:0;background:none;padding:8px 0 10px;color:var(--mut);font:inherit;font-size:11px;cursor:pointer}
.nav button span{display:block;font-size:20px;line-height:1.2}
.nav button.on{color:var(--or);font-weight:700}
.card{background:var(--tint);border-radius:16px;padding:14px;margin-bottom:10px}
.card.pk{background:var(--pk)}.card.nv{background:#14213D;color:#fff}
.card h3{margin:0 0 3px;font-size:16px}
.mut{color:var(--mut);font-size:13px}.nv .mut{color:#B9C4DA}
.btn{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--tint);color:var(--ink)}
.btn.or{background:var(--or);color:#fff}.btn.w{width:100%}.btn.sm{padding:6px 12px;font-size:13px}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.wr{flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.tag{font-size:11px;font-weight:800;color:var(--or);letter-spacing:.5px}
.opt{cursor:pointer;border:2px solid transparent;transition:.15s}.opt:hover{border-color:var(--or)}
.chip{background:var(--tint);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chips button.on{background:var(--or);color:#fff;border-color:var(--or)}
h2{margin:4px 0 2px;font-size:22px}
.big{font-size:28px;font-weight:800;color:var(--or);line-height:1.2}
.bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--or);transition:width .4s}
input[type=range]{width:100%;accent-color:var(--or)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sw input{width:22px;height:22px;accent-color:var(--or)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.grid span{aspect-ratio:1;border-radius:8px;background:var(--line)}.grid span.f{background:var(--or)}
.steps{display:flex;gap:6px;margin:10px 0}.steps i{flex:1;height:5px;border-radius:4px;background:var(--line)}.steps i.on{background:var(--or)}
.pulse{width:70px;height:70px;border-radius:50%;background:var(--pk);margin:12px auto;display:grid;place-items:center;font-size:30px;animation:p 1.2s infinite}
@keyframes p{50%{transform:scale(1.12)}}
.judge .panel{background:var(--card);border-radius:16px;padding:16px;border:1px solid var(--line);margin-bottom:14px}
.judge h3{margin:0 0 8px;font-size:16px}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.flow div{background:var(--tint);border-radius:10px;padding:6px 2px;text-align:center;font-size:11px;color:var(--mut)}.flow div.on{background:var(--or);color:#fff;font-weight:700}
pre{background:var(--tint);border-radius:10px;padding:10px;font-size:12px;overflow-x:auto;margin:6px 0;white-space:pre-wrap}
.log{max-height:150px;overflow-y:auto;font-size:13px;color:var(--mut)}.log div{padding:3px 0;border-bottom:1px dashed var(--line)}
.k3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.k3 div{background:var(--tint);border-radius:12px;padding:8px;text-align:center}.k3 b{font-size:20px;color:var(--or)}
summary{cursor:pointer}.note{font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
 <div class="phone"><div class="bar0"><span class="logo">yoxi 雷達</span><span class="chip" id="clock">11:00</span></div><div class="screen" id="screen"></div><div class="nav" id="nav"></div></div>
 <div class="judge">
  <div class="panel"><h3>評審導覽：AI 引擎即時判斷</h3><div class="flow" id="flow"></div><div id="trace"></div></div>
  <div class="panel"><h3>成效埋點（對應簡報 H1–H3）</h3><div class="k3" id="k3"></div><p class="note">H4 長期留存需 Pilot 實測。以下為事件紀錄：</p><div class="log" id="log"></div>
   <p class="note">全部為模擬資料，非真實 Pilot 結果。</p><div class="row wr"><button class="btn sm" onclick="nextDay()">模擬隔天</button><button class="btn sm" onclick="resetAll()">重置</button></div></div>
 </div>
</div>
<script>
const $=id=>document.getElementById(id);
const PK={e:{t:'容易',c:'--ok',r:[2,4]},m:{t:'普通',c:'--mid',r:[5,8]},h:{t:'困難',c:'--bad',r:[8,15]}};
const FAM=[{n:'日式定食',c:'日式',w:6,p:'m'},{n:'越式料理',c:'越式',w:8,p:'m'},{n:'港式燒臘',c:'港式',w:5,p:'e'},{n:'麵食小館',c:'麵食',w:4,p:'e'}];
const SUR=[{n:'韓式料理',c:'韓式',d:9,p:'h'},{n:'泰式料理',c:'泰式',d:12,p:'m'},{n:'義式餐酒館',c:'義式',d:14,p:'h'}];
const INT={airport:{n:'機場',s:[35,25,5,15],tip:'行李多、停車費高、時間敏感'},station:{n:'車站',s:[30,20,5,15],tip:'尖峰接駁需求集中'},bar:{n:'酒吧',s:[30,20,0,15],tip:'飲酒後不開車，提供安全回程'},hospital:{n:'醫院',s:[30,20,5,10],tip:'停車與步行負擔大'},event:{n:'活動散場',s:[30,25,5,15],tip:'人潮湧出、停車一位難求'},rain:{n:'雨天',s:[10,15,35,15],tip:'步行意願下降'},none:{n:'一般午後',s:[0,5,0,10],tip:'沒有明確移動壓力'}};
const SIG=['場域','停車難度','天氣','yoxi 供需'];
const S0=()=>({onb:0,c:{loc:1,time:1,beh:1},tab:0,sel:null,ride:null,opened:0,avail:90,rain:0,intent:'airport',pref:{日式:2,越式:1,港式:1,麵食:1},explored:12,newShops:0,saved:0,parkMin:0,log:[],ev:{open:0,view:0,decide:0,cta:0,ride:0},push:1,off:0});
let S=S0(),T=null;
const L=()=>Math.floor((S.avail-30)/2);
const log=t=>{S.log.unshift(new Date().toTimeString().slice(0,5)+'  '+t)};
function trace(i,h){$('flow').innerHTML=['Context','Discovery','Mobility Intent','LLM 轉譯','Learn Loop'].map((x,k)=>`<div class="${k===i?'on':''}">${x}</div>`).join('');$('trace').innerHTML=h}
function pick(){
  const l=L(),pr=x=>S.c.beh?(S.pref[x.c]||0):0;
  const f=FAM.filter(x=>x.w<=l).sort((a,b)=>pr(b)-pr(a)).slice(0,2).map((x,i)=>({...x,kind:i?'今天方便':'平常喜歡',trav:x.w,mode:'步行'}));
  const s=SUR.find(x=>x.d<=l);
  if(s)f.push({...s,kind:'今天不一樣',trav:s.d,mode:'車程'});
  return f;
}
const cta=o=>o.mode==='車程'||S.rain;
const pkTag=p=>`<span class="dot" style="background:var(${PK[p].c})"></span>停車${PK[p].t}`;
/* ---------- onboarding ---------- */
function onboard(){
  trace(0,'<p class="mut">首次使用：yoxi 提供的是去識別化群體趨勢；個人化僅來自你授權的 App 內互動，可隨時關閉或刪除。</p>');
  const sw=(k,t,d)=>`<div class="sw"><div><b>${t}</b><div class="mut">${d}</div></div><input type="checkbox" ${S.c[k]?'checked':''} onchange="S.c.${k}=this.checked?1:0"></div>`;
  return `<div style="text-align:center;margin:14px 0"><div class="pulse">📡</div><h2>yoxi 雷達</h2><div class="mut">想去哪 → 去得了 → 怎麼去</div></div>
  <div class="card"><b>讓推薦更懂你（可隨時關閉）</b>${sw('loc','常用地點','判斷工作生活圈與探索半徑')}${sw('time','常用時段','在合適時間提醒，每日最多 1 則')}${sw('beh','互動行為','學習你能接受的距離與口味')}</div>
  <p class="note">遵循個資法；送入 AI 的僅為結構化摘要，不含可識別個資。</p><button class="btn or w" onclick="S.onb=1;log('完成授權設定');render()">開始使用</button>`;
}
/* ---------- tab 0 radar ---------- */
function home(){
  if(S.off)return `<div class="card pk"><h3>雷達已關閉</h3><p class="mut">你已退出 yoxi 雷達，不會收到推薦與推播。</p><button class="btn or" onclick="S.off=0;render()">重新開啟</button></div>`;
  const l=L(),zone=S.c.loc?'工作生活圈':'預設區域（未授權）';
  const ctl=`<details class="card"><summary><b>評審情境控制</b></summary><label class="mut">距離下個行程 <b>${S.avail}</b> 分鐘</label><input type="range" min="40" max="120" step="5" value="${S.avail}" oninput="S.avail=+this.value;S.opened=1;render()"><label class="mut"><input type="checkbox" ${S.rain?'checked':''} onchange="S.rain=this.checked?1:0;render()"> 模擬下雨</label></details>`;
  const head=`<div class="mut">平日 11:00・${zone}</div><h2>今天想去哪？</h2><div class="chips"><span class="chip">下個行程 ${S.avail} 分後</span><span class="chip">${S.rain?'下雨':'晴'}</span><span class="chip">${l>=9?'探索半徑：放大':l>=6?'探索半徑：步行':'探索半徑：近距離'}</span></div>`;
  trace(0,`<p class="mut"><b>Context Engine</b>（時間序列）判斷目前情境；需求趨勢來自 yoxi 去識別化叫車時段與頻率：</p><pre>{"time":"11:00","yoxi_trend":"午餐前移動需求上升","zone":"${zone}","available_min":${S.avail},"max_one_way_min":${l},"weather":"${S.rain?'下雨':'晴'}"}</pre><p class="mut">${l>=9?'時間充裕 → 適度放大探索半徑':l>=6?'時間普通 → 以步行範圍為主':'時間緊 → 不安排驚喜'}</p>`);
  let push='';
  if(!S.opened){push=S.c.time&&S.push>0?`<div class="card nv opt" onclick="openIt()"><div class="tag">yoxi・11:00・今日 1/1 則</div><b>今天時間比較充裕，要不要吃遠一點？</b><div class="mut">點擊查看 3 個選項</div></div>`:`<div class="card"><b>${S.c.time?'今日推播已達上限（1/1）':'未授權常用時段，不主動推播'}</b><div class="mut">寧可少而準。</div></div>`;
    return head+push+`<button class="btn w" onclick="openIt()">直接開啟探索（非叫車情境）</button>`+ctl}
  const ps=pick();
  return head+`<div class="row sp" style="margin:8px 0"><b>2 個懂你＋1 個驚喜</b><button class="btn sm" onclick="log('重新整理推薦');render()">重新整理</button></div>`+ps.map((o,i)=>`<div class="card opt" onclick="sel(${i})"><div class="row sp"><span class="tag">${o.kind}</span><span class="mut">${o.mode} ${o.trav} 分</span></div><h3>${o.n}</h3><div class="mut">${pkTag(o.p)}${cta(o)?'・可叫 yoxi':''}</div></div>`).join('')+(ps.length<3?'<div class="card pk mut">時間較緊，今天不安排「驚喜」選項。</div>':'')+ctl;
}
function openIt(){if(!S.opened){S.opened=1;S.ev.open++;if(S.push>0)S.push--;log('H1 非叫車開啟');}render()}
function sel(i){S.sel=pick()[i];S.ev.view++;log('檢視 '+S.sel.n);render()}
function detail(){
  const o=S.sel,pk=PK[o.p],drv=o.mode==='車程'?o.trav:Math.max(3,Math.round(o.trav/3)),show=cta(o),f=pk.r;
  const sent=`${o.kind==='今天不一樣'?'今天換個口味，':''}${o.n}${o.mode}${o.trav}分，停車${pk.t}${show?'，搭 yoxi 可省下找位時間':'，走路就到'}。`;
  trace(3,`<p class="mut"><b>LLM 轉譯層</b>只把結構化判斷轉成一句話，不憑空決策：</p><pre>{"place":"${o.n}","type":"${o.kind}","${o.mode==='車程'?'drive':'walk'}_min":${o.trav},"parking":"${pk.t}","show_cta":${show}}</pre><p><b>→「${sent}」</b></p><p class="note">Phase 1 以難度分級呈現；Phase 2 才輸出找位區間並標示信心程度。</p>`);
  return `<button class="btn sm" onclick="S.sel=null;render()">← 返回</button><div class="card" style="margin-top:10px"><span class="tag">${o.kind}</span><h2>${o.n}</h2><div class="mut">${o.mode} ${o.trav} 分・${pkTag(o.p)}</div><p style="margin:8px 0 0">${sent}</p></div>
  ${show?`<b>怎麼去？</b><div class="row" style="margin:8px 0"><div class="card" style="flex:1;margin:0"><div class="mut">自行開車</div><div class="big">${drv+f[0]}–${drv+f[1]+3}<small style="font-size:13px"> 分</small></div><div class="mut">含找位約 ${f[0]}–${f[1]} 分（預估）</div></div><div class="card pk" style="flex:1;margin:0"><div class="mut">yoxi</div><div class="big">${drv+4}<small style="font-size:13px"> 分</small></div><div class="mut">預估等候 4 分，免找位</div></div></div>`:'<div class="card mut">步行即可抵達，不硬推叫車。</div>'}
  <div class="row"><button class="btn" style="flex:1" onclick="act('save')">收藏</button><button class="btn" style="flex:1" onclick="act('nav')">導航</button></div>${show?'<button class="btn or w" style="margin-top:8px" onclick="startRide(S.sel,0)">叫 yoxi 前往</button>':''}`;
}
function learn(o,w){S.pref[o.c]=(S.pref[o.c]||0)+w;trace(4,`<p class="mut"><b>Learn Loop</b>：記錄 DISCOVER→DECIDE→MOVE，更新對「${o.c||'此類'}」的偏好，下次更懂你。</p><pre>${JSON.stringify(S.pref)}</pre>`)}
function act(k){const o=S.sel;S.ev.decide++;if(k==='save'){S.saved++;log('H2 決策：收藏 '+o.n);learn(o,1)}else{S.explored++;S.newShops++;log('H2 決策：導航 '+o.n);learn(o,2)}S.sel=null;S.opened=1;S.tab=2;render0(1)}
/* ---------- ride flow ---------- */
function startRide(o,fromIntent){
  S.ev.cta++;S.ev.ride++;S.ride={o,st:0,p:0,fi:fromIntent};log('H3 叫車轉換：'+o.n);clearTimeout(T);
  T=setTimeout(function go(){const r=S.ride;if(!r)return;if(r.st===0)r.st=1;else if(r.st===1)r.st=2;else{r.p+=20;if(r.p>=100){r.st=3;S.explored++;S.newShops++;S.parkMin+=Math.round((PK[o.p].r[0]+PK[o.p].r[1])/2);learn(o,2);log('行程完成：'+o.n)}}
    if(r.st<3)T=setTimeout(go,r.st===1?1800:700);render()},1600);
  render();
}
function ride(){
  const r=S.ride,o=r.o,lab=['尋找附近車輛…','司機已接單・預計 4 分鐘抵達','行程中','已抵達'][r.st];
  const body=r.st===0?'<div class="pulse">🔎</div>':r.st===1?'<div class="card"><b>司機・示意</b><div class="mut">車牌 ABC-1234（示意）</div></div>':r.st===2?`<div class="bar" style="margin:16px 0"><i style="width:${r.p}%"></i></div>`:`<div class="card pk"><h3>🎉 已抵達 ${o.n}</h3><p class="mut">這趟省下約 ${Math.round((PK[o.p].r[0]+PK[o.p].r[1])/2)} 分鐘找停車時間，已加入你的探索足跡。</p><button class="btn or w" onclick="S.ride=null;S.sel=null;S.tab=2;render()">查看探索足跡</button></div>`;
  return `<div class="steps">${[0,1,2,3].map(i=>`<i class="${i<=r.st?'on':''}"></i>`).join('')}</div><h2 style="text-align:center">${lab}</h2><div class="mut" style="text-align:center">前往 ${o.n}</div>${body}${r.st<3?'<button class="btn w" onclick="clearTimeout(T);S.ride=null;log(\'取消叫車\');render()">取消</button>':''}`;
}
/* ---------- tab 1 intent ---------- */
function intent(){
  const x=INT[S.intent],sc=x.s.reduce((a,b)=>a+b,0),show=sc>=60;
  trace(2,`<p class="mut"><b>Mobility Intent Engine</b>（規則＋預測）綜合 yoxi 場域屬性（POI）、熱門上下車與活動熱點、路況、天氣與供需，達 60 分才顯示叫車入口；停車資料取得前以熱點密度代理。</p><pre>${x.s.map((v,i)=>SIG[i]+' '+v).join(' ｜ ')}\n合計 ${sc} → ${show?'顯示 CTA':'不顯示（不硬推）'}</pre>`);
  return `<h2>情境雷達</h2><div class="mut">模擬你正在以下場景</div><div class="chips">${Object.keys(INT).map(k=>`<button class="${S.intent===k?'on':''}" onclick="S.intent='${k}';render()">${INT[k].n}</button>`).join('')}</div>
  <div class="card"><h3>${x.n}</h3><div class="mut">${x.tip}</div></div>${x.s.map((v,i)=>`<div class="row sp mut"><span>${SIG[i]}</span><span>${v}</span></div><div class="bar" style="margin:3px 0 8px"><i style="width:${v*100/40}%"></i></div>`).join('')}<div class="big" style="margin:6px 0">${sc} 分</div>
  ${show?`<div class="card pk"><b>${S.intent==='bar'?'喝了酒就別開車':'現在適合叫 yoxi'}</b><div class="mut">預估等候 4 分</div><button class="btn or w" style="margin-top:8px" onclick="startRide({n:'${x.n}周邊',mode:'車程',trav:10,p:'e',c:''},1)">叫 yoxi 前往</button></div>`:'<div class="card"><b>不顯示叫車入口</b><div class="mut">沒有明確移動壓力，先提供價值，不打擾。</div></div>'}`;
}
/* ---------- tab 2 footprints ---------- */
function foot(){
  trace(4,'<p class="mut"><b>長期使用機制</b>：每日情境輪替、越用越懂、探索足跡、每週移動週報；每日最多 1 則推播。</p>');
  const f=Math.min(12,Math.round(S.explored/3)),top=Object.entries(S.pref).sort((a,b)=>b[1]-a[1]).slice(0,3);
  return `<h2>探索足跡</h2><div class="card"><div class="mut" style="margin-bottom:8px">已探索 ${S.explored} 家・生活圈 ${f}/12 區</div><div class="grid">${Array.from({length:12},(_,i)=>`<span class="${i<f?'f':''}"></span>`).join('')}</div></div>
  <div class="card pk"><h3>每週移動週報</h3><div class="row sp"><span>探索新店</span><b>${S.newShops+2} 家</b></div><div class="row sp"><span>收藏</span><b>${S.saved} 家</b></div><div class="row sp"><span>省下找停車時間</span><b>${S.parkMin} 分</b></div><div class="row sp"><span>常去時段</span><b>11:00–12:00</b></div></div>
  <div class="card"><h3>越用越懂</h3>${S.c.beh?top.map(([k,v])=>`<div class="mut">${k}</div><div class="bar" style="margin:2px 0 6px"><i style="width:${Math.min(100,v*14)}%"></i></div>`).join(''):'<div class="mut">未授權互動行為，目前不做個人化。</div>'}</div>`;
}
/* ---------- tab 3 me ---------- */
function me(){
  trace(0,'<p class="mut">隱私與控制：使用者可隨時調整授權、關閉雷達或刪除資料。</p>');
  const sw=(k,t)=>`<div class="sw"><b>${t}</b><input type="checkbox" ${S.c[k]?'checked':''} onchange="S.c.${k}=this.checked?1:0;log('授權變更：${t}');render()"></div>`;
  return `<h2>我的</h2><div class="card"><b>資料授權</b>${sw('loc','常用地點')}${sw('time','常用時段')}${sw('beh','互動行為')}</div>
  <div class="card"><div class="sw" style="border:0"><div><b>yoxi 雷達</b><div class="mut">關閉後不再收到推薦與推播</div></div><input type="checkbox" ${S.off?'':'checked'} onchange="S.off=this.checked?0:1;log('雷達 '+(S.off?'關閉':'開啟'));render()"></div></div>
  <div class="card"><b>推播頻率</b><div class="mut">每日最多 1 則，寧可少而準</div></div><button class="btn w" onclick="resetAll()">刪除我的資料並重置</button><p class="note">AI 僅轉譯結構化判斷；所有資料於本 Demo 中皆為模擬。</p>`;
}
/* ---------- shell ---------- */
function render0(keep){
  const t=S.tab;
  $('nav').style.display=S.onb&&!S.ride?'flex':'none';
  $('nav').innerHTML=[['📡','雷達'],['🌦','情境'],['🗺','足跡'],['👤','我的']].map((x,i)=>`<button class="${t===i?'on':''}" onclick="S.tab=${i};S.sel=null;render()"><span>${x[0]}</span>${x[1]}</button>`).join('');
  const keepTrace=keep?[$('flow').innerHTML,$('trace').innerHTML]:null;
  $('screen').innerHTML=!S.onb?onboard():S.ride?ride():S.sel?detail():[home,intent,foot,me][t]();
  if(keepTrace){$('flow').innerHTML=keepTrace[0];$('trace').innerHTML=keepTrace[1]}
  $('log').innerHTML=S.log.length?S.log.map(x=>`<div>${x}</div>`).join(''):'<div>尚無事件</div>';
  const e=S.ev;$('k3').innerHTML=`<div><b>${e.open}</b><div class="note">H1 非叫車開啟</div></div><div><b>${e.view?Math.round(e.decide*100/e.view):0}%</b><div class="note">H2 決策率</div></div><div><b>${e.cta?Math.round(e.ride*100/e.cta):0}%</b><div class="note">H3 叫車轉換</div></div>`;
}
function render(){render0(0)}
function nextDay(){S.push=1;S.opened=0;S.sel=null;S.ride=null;log('模擬隔天：推播額度重置');render()}
function resetAll(){clearTimeout(T);S=S0();render()}
render();
</script>
</body>
</html>
